apis:
- name: Brocade Fabric OS REST API
  description: The Brocade Fabric OS REST API provides a programmable web-service interface for managing Brocade
    SAN switches across a fabric. It supports YANG-based modules for configuring and monitoring switch resources
    including chassis, ports, zoning, security, logging, MAPS, and Fibre Channel features. Supported on Fabric OS
    8.2.0 and later.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://techdocs.broadcom.com/us/en/fibre-channel-networking/fabric-os/fabric-os-rest-api/9-2-x.html
  baseURL: https://{switch-ip}/rest
  tags:
  - Fabric OS
  - Fibre Channel
  - Network Management
  - SAN
  - Switches
