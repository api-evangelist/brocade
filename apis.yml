- name: Brocade VCS Fabric API
  description: The Brocade VCS Fabric API provided REST interfaces for Virtual Cluster Switching fabric configuration
    on Brocade VDX switches. The VCS Fabric product line was transferred to Extreme Networks as part of the data
    center networking business acquisition and is no longer part of the Broadcom Brocade portfolio.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
