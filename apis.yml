- name: Brocade Network Advisor REST API
  description: The Brocade Network Advisor REST API provided a web-services interface for configuring and monitoring
    Brocade SAN switches, including fabric management, topology, zoning, and performance data retrieval. Network
    Advisor reached end of life in March 2019 and has been replaced by SANnav Management Portal.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.broadcom.com/doc/12395099
  baseURL: https://{bna-host}/rest
