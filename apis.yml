- name: Brocade Workflow Composer API
  description: The Brocade Workflow Composer was a network automation platform based on StackStorm for event-driven
    automation and orchestration workflows. The product was transferred to Extreme Networks as part of the IP networking
    business acquisition and is now known as Extreme Workflow Composer.
