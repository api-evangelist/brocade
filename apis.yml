- name: Brocade SANnav Management Portal REST API
  description: The Brocade SANnav Management Portal REST API provides a programmable web-service interface for accessing
    and managing the SANnav Management Portal server. REST API services include Login, Discovery, FCR, Fault, Inventory,
    Health Summary, User Management, RBAC, Zoning, and Proxy to Fabric OS REST API. SANnav is the successor to Brocade
    Network Advisor for SAN management.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://techdocs.broadcom.com/us/en/fibre-channel-networking/sannav/management-portal-rest-api/3-0-0x.html
  baseURL: https://{sannav-host}/external-api/v1
