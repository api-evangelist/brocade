- name: Brocade SANnav Northbound Streaming API
  description: The Brocade SANnav Northbound Streaming API enables real-time streaming of SAN telemetry and event
    data from the SANnav Management Portal to external systems. It provides northbound streaming of fault events,
    performance metrics, and inventory changes for integration with third-party monitoring and analytics platforms.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://techdocs.broadcom.com/us/en/fibre-channel-networking/sannav/management-portal-rest-api-and-nb-streaming/2-3-0x.html
