name: Brocade
description: Brocade, now part of Broadcom, provides Fibre Channel networking solutions for storage area networks
  (SANs). The Brocade portfolio includes SAN switches, directors, Fabric OS software, and the SANnav management
  platform, all offering REST APIs for programmable management and automation of SAN infrastructure.
